# ================================================================
# Blueprint de Render: Dashboard -> New -> Blueprint -> este repo.
# Las claves con "sync: false" se piden al crear el servicio
# (no se guardan valores secretos en el repositorio).
# ================================================================
services:
  - type: web
    name: crud-docentes-hexagonal
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /public/index.php?route=auth.login
    envVars:
      # Base de datos: Supabase (PostgreSQL) por Session pooler
      - key: DB_DRIVER
        value: pgsql
      - key: DB_HOST
        sync: false        # aws-0-<region>.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false        # postgres.<id-del-proyecto>
      - key: DB_PASSWORD
        sync: false        # clave de la base de datos de Supabase
      - key: DB_SSLMODE
        value: require
      # Correo (opcional; Render free bloquea SMTP y la app sigue funcionando)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_ENCRYPTION
        value: tls
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_ADDRESS
        sync: false
      - key: SMTP_FROM_NAME
        value: CRUD Docentes
